<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Pay with Bakong KHQR — Jomrous</title>
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('theme') || 'light';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    };
  </script>
  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #f8f7f4; color: #18181b; }
    html.dark body { background: #11121d; color: #f1f5f9; }
    .gold { color: #b38c2b; }
    html.dark .gold { color: #c9a84c; }
    .btn-gold { background: linear-gradient(135deg, #1f2024, #121316); color: #ffffff; border: 1px solid rgba(179, 140, 43, 0.45); font-weight: 700; box-shadow: 0 4px 16px rgba(18, 19, 22, 0.2); }
    .btn-gold:hover { background: linear-gradient(135deg, #27282e, #17181c); border-color: rgba(179, 140, 43, 0.75); }
    html.dark .btn-gold { background: linear-gradient(135deg, #c9a84c, #e5c36a); color: #000; border: none; box-shadow: 0 4px 20px rgba(201, 168, 76, 0.28); }
    .btn-gold:disabled { opacity: 0.5; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center px-4 py-6 transition-colors duration-200">
  <div class="w-full max-w-sm mx-auto text-center space-y-4">
    <div>
      <p class="text-[10px] uppercase tracking-widest text-slate-500 dark:text-slate-400 font-semibold">Jomrous Jewelry</p>
      <h1 class="text-lg font-extrabold text-slate-900 dark:text-white mt-1">Scan to Pay</h1>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5" id="order-label">Loading order…</p>
    </div>

    <div class="rounded-2xl bg-white p-3 shadow-xl border border-black/5 dark:border-transparent mx-auto w-64 h-64 flex items-center justify-center">
      <img id="qr-img" alt="Bakong KHQR" class="w-full h-full object-contain hidden" />
      <span id="qr-loading" class="text-sm font-bold text-slate-600">Generating QR…</span>
    </div>

    <div>
      <p class="text-2xl font-extrabold text-slate-900 dark:text-white" id="amount-usd">$0.00</p>
      <p class="text-sm font-semibold gold" id="amount-khr">៛0</p>
      <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-1" id="expiry-hint">QR valid for 15 minutes</p>
    </div>

    <div class="rounded-xl bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 p-3 text-left text-[11px] text-slate-700 dark:text-slate-300 space-y-1">
      <p>1. Open <strong class="text-slate-900 dark:text-white">ABA / Wing / ACLEDA / Bakong</strong></p>
      <p>2. Choose <strong class="text-slate-900 dark:text-white">Scan QR</strong></p>
      <p>3. Pay the exact amount shown above</p>
      <p>4. Tap <strong class="text-slate-900 dark:text-white">I've Paid</strong> below when done</p>
    </div>

    <div id="status-box" class="hidden rounded-xl p-3 text-xs font-semibold"></div>

    <button type="button" id="btn-paid" class="btn-gold w-full py-3.5 rounded-2xl text-sm shadow-lg">
      ✓ I've Paid — Notify Shop
    </button>

    <button type="button" id="btn-check" class="w-full py-2.5 rounded-2xl text-xs font-semibold text-slate-700 dark:text-slate-300 bg-black/5 dark:bg-white/10 border border-black/10 dark:border-white/10">
      🔄 Check Payment Status
    </button>

    <button type="button" id="btn-home" class="w-full py-2.5 rounded-2xl text-xs font-semibold text-slate-500 hover:text-black dark:text-slate-400 dark:hover:text-white">
      ← Back to Shop
    </button>

    <p class="text-[10px] text-slate-500 pb-6">
      Owner confirms in Bakong app. You get a Messenger receipt when verified.
    </p>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const orderId = params.get('orderId') || params.get('order');
      const md5FromUrl = params.get('md5') || '';
      let currentMd5 = md5FromUrl;
      let pollTimer = null;
      let paid = false;

      const qrImg = document.getElementById('qr-img');
      const qrLoading = document.getElementById('qr-loading');
      const amountUsd = document.getElementById('amount-usd');
      const amountKhr = document.getElementById('amount-khr');
      const orderLabel = document.getElementById('order-label');
      const statusBox = document.getElementById('status-box');
      const btnPaid = document.getElementById('btn-paid');
      const btnCheck = document.getElementById('btn-check');
      const btnHome = document.getElementById('btn-home');

      function formatUSD(n) { return '$' + Number(n || 0).toFixed(2); }
      function formatKHR(n) { return '៛' + Math.round(Number(n || 0) * 4100).toLocaleString(); }

      function setStatus(msg, type) {
        statusBox.classList.remove('hidden');
        statusBox.textContent = msg;
        statusBox.className = 'rounded-xl p-3 text-xs font-semibold ' + (
          type === 'success' ? 'bg-emerald-500/15 dark:bg-emerald-950/80 border border-emerald-500/30 dark:border-emerald-500/40 text-emerald-800 dark:text-emerald-200' :
          type === 'error' ? 'bg-rose-500/15 dark:bg-rose-950/80 border border-rose-500/30 dark:border-rose-500/40 text-rose-800 dark:text-rose-200' :
          'bg-amber-500/15 dark:bg-amber-950/80 border border-amber-500/30 dark:border-amber-500/40 text-amber-800 dark:text-amber-200'
        );
      }

      function goHome() {
        // Return to storefront; keep Messenger identity if present in URL or session
        let qs = '';
        try {
          const psid = sessionStorage.getItem('luxe_psid');
          const sig = sessionStorage.getItem('luxe_sig');
          if (psid && sig) {
            qs = '?psid=' + encodeURIComponent(psid) + '&sig=' + encodeURIComponent(sig);
          } else if (window.location.search.includes('psid=')) {
            qs = window.location.search;
          }
        } catch (e) {}
        window.location.href = '/' + qs;
      }

      btnHome.addEventListener('click', goHome);

      async function loadOrder() {
        if (!orderId) {
          orderLabel.textContent = 'Missing order ID';
          qrLoading.textContent = 'No order';
          return;
        }
        orderLabel.textContent = 'Order ' + orderId;

        try {
          const res = await fetch('/api/payments/order/' + encodeURIComponent(orderId));
          const data = await res.json();
          if (!data.success) throw new Error(data.error || 'Failed to load');

          amountUsd.textContent = formatUSD(data.total);
          amountKhr.textContent = formatKHR(data.total);

          if (data.status !== 'PENDING') {
            paid = true;
            setStatus('Order status: ' + data.status + '. Payment already processed.', 'success');
            btnPaid.disabled = true;
            btnPaid.textContent = '✓ Already Confirmed';
            qrLoading.textContent = data.status;
            return;
          }

          const payment = data.payment;
          if (payment && payment.qrImage) {
            qrImg.src = payment.qrImage;
            qrImg.classList.remove('hidden');
            qrLoading.classList.add('hidden');
            if (payment.md5) currentMd5 = payment.md5;
            if (payment.demo) {
              setStatus('Demo QR — set BAKONG_ACCOUNT_ID on server for live payable QR.', 'error');
            }
          } else {
            qrLoading.textContent = 'QR unavailable';
          }

          // Auto-poll every 8s if we have md5
          if (currentMd5) startPolling();
        } catch (e) {
          qrLoading.textContent = 'Error';
          setStatus(e.message || 'Could not load payment', 'error');
        }
      }

      async function checkStatus() {
        if (!currentMd5 && !orderId) return;
        btnCheck.disabled = true;
        try {
          const res = await fetch('/api/payments/check-status', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ md5: currentMd5 || undefined, orderId }),
          });
          const data = await res.json();
          if (data.paid) {
            paid = true;
            stopPolling();
            setStatus(data.message || 'Payment verified! Order confirmed.', 'success');
            btnPaid.disabled = true;
            btnPaid.textContent = '✓ Payment Confirmed';
            setTimeout(goHome, 2500);
          } else {
            setStatus(data.reason || ('Status: ' + (data.status || 'PENDING')), 'info');
          }
        } catch (e) {
          setStatus(e.message || 'Check failed', 'error');
        } finally {
          btnCheck.disabled = false;
        }
      }

      function startPolling() {
        stopPolling();
        pollTimer = setInterval(() => {
          if (!paid) checkStatus();
        }, 8000);
      }
      function stopPolling() {
        if (pollTimer) clearInterval(pollTimer);
        pollTimer = null;
      }

      btnCheck.addEventListener('click', checkStatus);

      btnPaid.addEventListener('click', async () => {
        btnPaid.disabled = true;
        btnPaid.textContent = 'Notifying…';
        try {
          // First try automatic status check
          if (currentMd5) {
            const res = await fetch('/api/payments/check-status', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ md5: currentMd5, orderId }),
            });
            const data = await res.json();
            if (data.paid) {
              paid = true;
              stopPolling();
              setStatus(data.message || 'Payment verified!', 'success');
              btnPaid.textContent = '✓ Payment Confirmed';
              setTimeout(goHome, 2000);
              return;
            }
          }

          // Notify owner that customer claims payment
          const res2 = await fetch('/api/payments/customer-paid', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ orderId }),
          });
          const data2 = await res2.json();
          setStatus(data2.message || 'Shop notified. Please wait for confirmation.', 'success');
          btnPaid.textContent = '✓ Notified — Waiting for owner';
          // Stay on page; owner confirms via Telegram → stock moves
        } catch (e) {
          setStatus(e.message || 'Could not notify', 'error');
          btnPaid.disabled = false;
          btnPaid.textContent = "✓ I've Paid — Notify Shop";
        }
      });

      loadOrder();
    })();
  </script>
</body>
</html>
